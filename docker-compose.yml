services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app1:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      APP_BIND_ADDR: 0.0.0.0:8080
    expose:
      - "8080"

  app2:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      APP_BIND_ADDR: 0.0.0.0:8080
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app1
      - app2
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mongo-data:
